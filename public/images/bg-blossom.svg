<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="presentation">
  <defs>
    <!-- Ciel rose de Marrakech au crépuscule -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9c9d9" />
      <stop offset="32%" stop-color="#fbd6e2" />
      <stop offset="62%" stop-color="#fde6ee" />
      <stop offset="100%" stop-color="#fff6f9" />
    </linearGradient>
    <radialGradient id="sun" cx="72%" cy="8%" r="55%">
      <stop offset="0%" stop-color="#ffe7c9" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#ffd0dd" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffd0dd" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e79bb4" />
      <stop offset="100%" stop-color="#f3c2d2" />
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" />
    </filter>
    <filter id="softer" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
    <!-- Fleur de bougainvillier : cinq pétales autour d'un cœur clair -->
    <g id="flower">
      <circle cx="0" cy="-9" r="8" />
      <circle cx="8.6" cy="-2.8" r="8" />
      <circle cx="5.3" cy="7.3" r="8" />
      <circle cx="-5.3" cy="7.3" r="8" />
      <circle cx="-8.6" cy="-2.8" r="8" />
      <circle cx="0" cy="0" r="3.2" fill="#fff2cf" />
    </g>
  </defs>

  <!-- Fond ciel -->
  <rect width="1600" height="1000" fill="url(#sky)" />
  <rect width="1600" height="1000" fill="url(#sun)" />

  <!-- Minaret Koutoubia stylisé, en haut à droite, estompé -->
  <g fill="url(#tower)" opacity="0.5" filter="url(#soft)">
    <rect x="1290" y="150" width="86" height="330" rx="6" />
    <rect x="1305" y="95" width="56" height="70" rx="5" />
    <rect x="1322" y="55" width="22" height="52" rx="4" />
    <circle cx="1333" cy="46" r="12" />
    <!-- arcs décoratifs suggérés -->
    <rect x="1305" y="215" width="56" height="34" rx="16" fill="#fbd6e2" opacity="0.6" />
    <rect x="1305" y="285" width="56" height="34" rx="16" fill="#fbd6e2" opacity="0.6" />
    <rect x="1305" y="355" width="56" height="34" rx="16" fill="#fbd6e2" opacity="0.6" />
  </g>
  <!-- coupole/palmiers suggérés au loin -->
  <g fill="#eaa7bf" opacity="0.35" filter="url(#softer)">
    <ellipse cx="1180" cy="470" rx="120" ry="40" />
    <ellipse cx="1420" cy="500" rx="150" ry="46" />
  </g>

  <!-- Grappes de bougainvilliers dans les coins, très douces -->
  <g filter="url(#softer)" opacity="0.55">
    <g fill="#f06aa0">
      <use href="#flower" transform="translate(90,70) scale(2.6)" />
      <use href="#flower" transform="translate(180,40) scale(2.0)" />
      <use href="#flower" transform="translate(60,190) scale(2.2)" />
      <use href="#flower" transform="translate(210,150) scale(1.7)" />
      <use href="#flower" transform="translate(150,240) scale(1.5)" />
    </g>
    <g fill="#e84f8f">
      <use href="#flower" transform="translate(130,120) scale(1.8)" />
      <use href="#flower" transform="translate(30,90) scale(1.4)" />
    </g>
  </g>
  <g filter="url(#softer)" opacity="0.5">
    <g fill="#f06aa0">
      <use href="#flower" transform="translate(1500,120) scale(2.4)" />
      <use href="#flower" transform="translate(1420,60) scale(1.9)" />
      <use href="#flower" transform="translate(1540,230) scale(1.8)" />
    </g>
  </g>

  <!-- Quelques pétales qui tombent -->
  <g fill="#f28cb2" opacity="0.5" filter="url(#soft)">
    <use href="#flower" transform="translate(430,150) scale(1.1)" />
    <use href="#flower" transform="translate(620,90) scale(0.8)" />
    <use href="#flower" transform="translate(300,320) scale(0.9)" />
    <use href="#flower" transform="translate(1180,180) scale(0.9)" />
    <use href="#flower" transform="translate(980,120) scale(0.7)" />
  </g>

  <!-- Voile clair vers le bas pour la lisibilité du contenu -->
  <rect width="1600" height="1000" fill="url(#sky)" opacity="0.15" />
</svg>
